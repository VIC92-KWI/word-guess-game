<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ເກມຄຳສັບເກົາຫລີ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ເກມຄຳສັບເກົາຫລີ</h1>
  </header>

  <section id="menu-view">
    <h2>ເລືອກໝວດຄຳສັບ</h2>
    <div id="category-list"></div>
  </section>

  <section id="study-view" hidden>
    <button id="back-to-menu" type="button">← ກັບຄືນ</button>
    <h2 id="category-title"></h2>
    <ul id="word-list"></ul>
    <button id="start-game" type="button">ຫຼິ້ນເກມຈັບຄູ່</button>
  </section>

  <section id="game-view" hidden>
    <button id="back-to-study" type="button">← ກັບຄືນ</button>
    <p id="score">ຄະແນນ: 100/100</p>
    <p id="status">ຕຽມພ້ອມ</p>
    <main id="board"></main>
    <button id="restart" type="button">ຫລິ້ນໃຫມ່</button>
  </section>

  <!-- ข้อความชนะ + คะแนน + ปุ่มต่าง ๆ จะใส่ตรงนี้ -->
  <section id="result-view" hidden>
    <button id="back-to-form-result" type="button">← ກັບຄືນ</button>
    <h2 id="result-title">ເກັ່ງຫຼາຍ! ຈັບຄູ່ຄົບແລ້ວ</h2>
    <p id="final-score"></p>
    <button id="play-again" type="button">ຫລິ້ນໃຫມ່</button>
  </section>

  <section id="gameover-view" hidden>
    <h2 id="gameover-title">ລອງໃຫມ່ອີກຄັ້ງ</h2>
    <button id="try-again" type="button">ລອງໃຫມ່</button>
    <button id="back-to-menu-from-gameover" type="button">← ກັບຄືນ</button>
  </section>

  <!-- words.js ຕ້ອງໂຫລດກ່ອນ script.js -->
  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
